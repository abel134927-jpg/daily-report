name: 每日新聞推送

on:
  workflow_run:
    workflows: ["每日財經早報"]   # 財經早報 commit 後立即接著跑，避免 schedule 延遲
    types: [completed]
  schedule:
    - cron: '0 1 * * *'  # 備用：UTC 01:00 = 台灣時間 09:00（GitHub schedule 可能延遲）
  workflow_dispatch:     # 允許手動觸發

jobs:
  hardware-news:
    name: 硬體新聞
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run 觸發時只在上游成功後執行；schedule/workflow_dispatch 直接跑
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run hardware news
        env:
          DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID:              ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID:             ${{ secrets.LINE_GROUP_ID }}
        run: python news_collector.py

  ai-news:
    name: AI 新聞
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: hardware-news   # 硬體新聞發完後再發 AI 新聞，避免訊息交錯
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run AI news
        env:
          DEEPSEEK_API_KEY:          ${{ secrets.DEEPSEEK_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID:              ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID:             ${{ secrets.LINE_GROUP_ID }}
        run: python ai_news_collector.py
